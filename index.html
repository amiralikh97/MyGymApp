<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Iron Log</title>
<meta name="description" content="Lightweight offline workout tracker: log sets, weights, rest timers and strength progress.">
<meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div style="flex:1;min-width:0">
      <h1 id="title">Train</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="row" id="topActions"></div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" id="aiFab" aria-label="AI Coach" title="AI Coach">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="4" y="8" width="16" height="12" rx="4"/>
    <path d="M12 8V4.5M9.5 14h.01M14.5 14h.01M9 17.5h6"/>
    <path d="M2 13v3M22 13v3"/>
  </svg>
</button>

<div class="rest-bar" id="restBar"><div class="rest-inner" id="restInner"></div></div>

<nav class="nav"><div class="nav-inner" id="nav"></div></nav>

<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet">
  <div class="grab"></div>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn plain" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
